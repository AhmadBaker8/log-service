name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    name: Typecheck, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # ci rather than install: fails if the lockfile disagrees with
      # package.json, so the pipeline cannot silently resolve different
      # versions from a developer machine.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  contract:
    name: Contract smoke test
    runs-on: ubuntu-latest
    # Static checks are cheap and catch most failures; running the full
    # stack only after they pass keeps feedback fast.
    needs: static
    steps:
      - uses: actions/checkout@v5

      # Builds and starts the whole stack exactly as a grader would, from
      # a clean checkout. This catches files that exist locally but were
      # never committed.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Service healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not become healthy within 60s"
          docker compose logs
          exit 1

      - name: Verify the required contract
        run: ./scripts/contract-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
